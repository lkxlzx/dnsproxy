# 域名分组功能测试配置
# 测试场景：国内域名使用国内DNS，海外域名使用海外DNS

listen-addrs:
  - "127.0.0.1"
listen-ports:
  - 5301
cache: true
verbose: true

upstream-groups:
  default_group: "overseas"
  
  groups:
    # 海外 DNS 组
    - name: "overseas"
      upstreams:
        - "8.8.8.8"
        - "1.1.1.1"
      mode: "load_balance"
      timeout: "5s"
    
    # 国内 DNS 组
    - name: "china"
      upstreams:
        - "223.5.5.5"
        - "119.29.29.29"
      mode: "load_balance"
      timeout: "5s"
  
  # 域名分组映射
  domain_groups:
    # 海外域名（直接指定）
    "google.com": "overseas"
    "*.google.com": "overseas"
    "youtube.com": "overseas"
    "*.youtube.com": "overseas"
    "facebook.com": "overseas"
    "*.facebook.com": "overseas"
    "twitter.com": "overseas"
    "*.twitter.com": "overseas"
    
    # 国内域名（直接指定）
    "baidu.com": "china"
    "*.baidu.com": "china"
    "qq.com": "china"
    "*.qq.com": "china"
    "taobao.com": "china"
    "*.taobao.com": "china"
    "jd.com": "china"
    "*.jd.com": "china"
    "163.com": "china"
    "*.163.com": "china"
    "sina.com.cn": "china"
    "*.sina.com.cn": "china"
