# 缓存功能测试配置

dns:
    bind_hosts:
        - 127.0.0.1
    port: 5353
    upstream_dns:
        - 223.5.5.5
# 上游分组
upstream_groups:
    - id: china-id
      name: china
      enabled: true
      upstreams:
        - 223.5.5.5
        - 119.6.6.6
      mode: load_balance
      timeout: 10s
    - id: overseas-id
      name: overseas
      enabled: true
      upstreams:
        - 8.8.8.8
        - 1.1.1.1
      mode: load_balance
      timeout: 10s
    - id: default-id
      name: default
      enabled: true
      upstreams:
        - 114.114.114.114
      mode: load_balance
      timeout: 10s
# 域名分组
domain_groups:
    china-id:
        domains:
            - baidu.com
            - taobao.com
    overseas-id:
        domains:
            - google.com
            - youtube.com
# 域名列表（使用远程 URL 测试下载功能）
domains_lists:
    # 中国域名列表 - 从 GitHub 下载
    - name: china-domains
      source: https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/accelerated-domains.china.conf
      group: china-id
      file: ./cache/china-domains.yaml
      auto_update: true
      refresh_interval: 24h
      enabled: true
      format: dnsmasq
      domain_count: 114898
      last_updated: "2026-05-04T11:19:15+08:00"
    # GFW 列表 - 从 GitHub 下载
    - name: gfwlist
      source: https://raw.githubusercontent.com/gfwlist/gfwlist/master/gfwlist.txt
      group: overseas-id
      file: ./cache/gfwlist.yaml
      auto_update: true
      refresh_interval: 24h
      enabled: true
      format: gfwlist
      domain_count: 4161
      last_updated: "2026-05-04T11:19:15+08:00"
# 默认分组
default_group: default-id
# 缓存配置
cache:
    enabled: true
    directory: ./cache
    ttl: 24h
    default_refresh_interval: 24h
    auto_update: true
    max_size: 100MB
    cleanup_interval: 1h
